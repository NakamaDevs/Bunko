name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # nakama-workload: native-macos
    name: Verify Bunko on macOS
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'nakama-dependabot-macos-arm64' || 'nakama-macos-arm64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.17
          cache: false
          install_args: node uv gitleaks actionlint prek
      - run: mise run setup
      - run: mise run verify
        env:
          PR_BASE_REVISION: ${{ github.event.pull_request.base.sha || 'HEAD^1' }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
