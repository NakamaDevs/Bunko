name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # nakama-workload: server-only
    name: Verify Bunko on Ubuntu
    # NAK-1009: standard runners are free only while this repository is public.
    if: ${{ github.event.repository.visibility == 'public' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Resolve binary paths from the locked GNU archives (NAK-1009).
          version: 2026.9.9
          cache: false
          install_args: node uv gitleaks actionlint prek
      - name: Check installed tool paths
        run: |
          uv --version
          prek --version
      - run: mise run setup
      - run: mise run verify
        env:
          PR_BASE_REVISION: ${{ github.event.pull_request.base.sha || 'HEAD^1' }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
